name: Security and regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Scan all Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts="--all --full-history" --no-banner
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contact quota Lua regressions (no live Redis)
        run: |
          python -m venv "$RUNNER_TEMP/contact-lua"
          "$RUNNER_TEMP/contact-lua/bin/python" -m pip install lupa==2.6
          "$RUNNER_TEMP/contact-lua/bin/python" scripts/test-contact-lua.py
      - run: pnpm build
        env:
          SITE_URL: https://tudoriacob.cloud.run
      - run: python scripts/smoke-production.py
      - run: pnpm audit --prod
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-runtime.txt -c backend/requirements.lock.txt pytest PyYAML
      - run: python -m pip check
      - name: Backend regressions (no live providers)
        working-directory: backend
        run: python -m pytest -q
      - name: Audit Python dependency files in isolated tooling
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/audit/bin/python" -m pip_audit -r backend/requirements-runtime.txt
          "$RUNNER_TEMP/audit/bin/python" -m pip_audit -r backend/requirements.lock.txt
      - name: Build containers and verify non-root runtime
        run: |
          docker build --pull -t portfolio-web-security .
          docker build --pull -t tai-backend-security backend
          test "$(docker run --rm --entrypoint id portfolio-web-security -u)" != 0
          test "$(docker run --rm --entrypoint id tai-backend-security -u)" != 0
      - name: Inspect browser and standalone artifacts
        run: python scripts/check-security-artifacts.py
